<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <!-- ?v= is not decoration. A browser caches a favicon by URL and will not
         re-fetch it on a reload, so the day-timeline mark stayed in the tab
         long after the file became the globe. Bump this whenever the icon
         changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- Installable: the manifest names the app and its icons for Android and
         desktop; iOS reads its own icon from apple-touch-icon and ignores the
         manifest's. The PNGs are drawn from favicon.svg — redraw them if the
         mark changes. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Safari → Share → Add to Home Screen: open full screen with no address
         bar, under this name rather than the page title. "default" keeps the
         status bar its own white strip above the app, so nothing is drawn
         under the clock. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SchedulePlan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/splash.css" />
    <title>SchedulePlan</title>
  </head>
  <body>
    <!-- The opening screen, drawn before any script runs: the globe from the
         app mark, with its plane flying round it and a trail of dots behind.
         Styled by splash.css; lib/splash.ts fades it out once the first
         screen is drawn. The plane is the same path as in Logo.tsx. -->
    <div id="splash" role="status">
      <svg class="splash-mark" viewBox="-60 -60 120 120" aria-hidden="true">
        <g class="splash-globe" fill="none" stroke="#6C5CE7" stroke-linecap="round">
          <circle r="22" stroke-width="4.5" />
          <ellipse rx="9" ry="22" stroke-width="3.2" />
          <path d="M-22 0H22" stroke-width="3.2" />
        </g>
        <g class="splash-flight" fill="#6C5CE7">
          <circle cx="-12.1" cy="-42.3" r="3.20" opacity="1.0" />
          <circle cx="-20.0" cy="-39.2" r="2.92" opacity="0.9" />
          <circle cx="-27.1" cy="-34.7" r="2.64" opacity="0.8" />
          <circle cx="-33.2" cy="-28.9" r="2.36" opacity="0.7" />
          <circle cx="-38.1" cy="-22.0" r="2.08" opacity="0.6" />
          <circle cx="-41.6" cy="-14.3" r="1.80" opacity="0.5" />
          <circle cx="-43.6" cy="-6.1" r="1.52" opacity="0.4" />
          <circle cx="-43.9" cy="2.3" r="1.24" opacity="0.3" />
          <circle cx="-42.7" cy="10.6" r="0.96" opacity="0.2" />
          <path transform="translate(3 -44) scale(0.5)"
                d="M30 0 2 6l-18 20h-6l14-20h-16l-8 8h-4l4-10-4-10h4l8 8h16l-14-20h6l18 20z" />
        </g>
      </svg>
      <p class="splash-name">SchedulePlan</p>
      <p class="splash-sub">
        <span class="splash-en">Opening your notebook…</span>
        <span class="splash-zh">正在打开你的记事本…</span>
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
